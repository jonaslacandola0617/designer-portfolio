name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://portfolio:portfolio@localhost:5432/portfolio_test
      DIRECT_URL: postgresql://portfolio:portfolio@localhost:5432/portfolio_test
      TEST_DATABASE_URL: postgresql://portfolio:portfolio@localhost:5432/portfolio_test
      AUTH_SECRET: disposable-ci-session-secret-at-least-32-characters
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: disposable-ci-password-2026
      SEED_SAMPLES: "true"
      S3_ENDPOINT: http://127.0.0.1:55433
      S3_REGION: us-east-1
      S3_BUCKET: portfolio
      S3_ACCESS_KEY_ID: local-test
      S3_SECRET_ACCESS_KEY: local-test
      S3_PUBLIC_BASE_URL: http://127.0.0.1:55433/portfolio
      S3_FORCE_PATH_STYLE: "true"
      ALLOW_LOCAL_IMAGE_IP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-storage.mjs &
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
